name: Build
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm run build:exe
      - uses: actions/upload-artifact@v4
        with:
          name: MINE-BOLT-EXE
          path: release
